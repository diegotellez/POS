<div class="login-fondo">
  <mat-card class="login-card">
    <div class="login-marca">
      <div class="login-logo">POS</div>
      <h1>Punto de Venta</h1>
      <p class="pos-texto-cuerpo">Ingresa con tu usuario y contraseña</p>
    </div>

    <form (ngSubmit)="ingresar()" #f="ngForm">
      <mat-form-field appearance="outline" class="campo">
        <mat-label>Usuario</mat-label>
        <input matInput name="nombreUsuario" [(ngModel)]="nombreUsuario" required autofocus />
      </mat-form-field>

      <mat-form-field appearance="outline" class="campo">
        <mat-label>Contraseña</mat-label>
        <input matInput type="password" name="password" [(ngModel)]="password" required />
      </mat-form-field>

      @if (error()) {
        <p class="pos-alerta">{{ error() }}</p>
      }

      <button
        mat-raised-button
        color="primary"
        class="boton-ingresar"
        type="submit"
        [disabled]="!f.valid || cargando()"
      >
        @if (cargando()) {
          <mat-spinner diameter="20"></mat-spinner>
        } @else {
          Ingresar
        }
      </button>
    </form>
  </mat-card>
</div>
