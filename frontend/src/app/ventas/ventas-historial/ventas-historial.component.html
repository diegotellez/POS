<mat-card>
  <h2>Historial de ventas</h2>

  <table mat-table [dataSource]="ventas()" class="tabla-ventas">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>#</th>
      <td mat-cell *matCellDef="let v">{{ v.id }}</td>
    </ng-container>

    <ng-container matColumnDef="fecha_hora">
      <th mat-header-cell *matHeaderCellDef>Fecha</th>
      <td mat-cell *matCellDef="let v">{{ v.fecha_hora }}</td>
    </ng-container>

    <ng-container matColumnDef="nombre_usuario">
      <th mat-header-cell *matHeaderCellDef>Usuario</th>
      <td mat-cell *matCellDef="let v">{{ v.nombre_usuario }}</td>
    </ng-container>

    <ng-container matColumnDef="total">
      <th mat-header-cell *matHeaderCellDef>Total</th>
      <td mat-cell *matCellDef="let v">${{ v.total.toFixed(2) }}</td>
    </ng-container>

    <ng-container matColumnDef="estado">
      <th mat-header-cell *matHeaderCellDef>Estado</th>
      <td mat-cell *matCellDef="let v" [class.pos-alerta]="v.estado === 'ANULADA'">
        {{ v.estado }}
      </td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let v">
        @if (v.estado === 'COMPLETADA') {
          <button mat-button color="warn" (click)="anular(v)">Anular</button>
        }
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnas"></tr>
    <tr mat-row *matRowDef="let row; columns: columnas"></tr>
  </table>
</mat-card>
